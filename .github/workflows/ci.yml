name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (warning caps are the as-any ratchet — lower, never raise)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # K1 (#215) — pin the npm publish SHAPE so a refactor can't silently drop the
      # runnable entrypoint. `npm pack --dry-run` runs AFTER build (dist/ exists) and
      # does NOT trigger prepublishOnly, so it reflects exactly what `npm publish`
      # would ship. Assert the tarball carries the server entry + built web UI, and
      # that the bin map keeps the scope-stripped "mcp-server" name (npx -y
      # @deeppairing/mcp-server resolves the bin by the unscoped name). Dependency-free.
      - name: Publish-shape gate (npm pack shape is pinned)
        working-directory: packages/mcp-server
        run: |
          npm pack --dry-run --json > /tmp/dp-pack.json
          node -e '
            const fs = require("node:fs");
            const pack = JSON.parse(fs.readFileSync("/tmp/dp-pack.json", "utf8"));
            const entry = Array.isArray(pack) ? pack[0] : pack;
            const files = (entry.files || []).map((f) => f.path);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const need = ["dist/standalone.js", "dist/web/index.html"];
            const errs = [];
            for (const p of need) if (!files.includes(p)) errs.push("tarball is missing " + p);
            if (!(pkg.bin && pkg.bin["mcp-server"] === "./dist/standalone.js")) {
              errs.push("package.json bin must map \"mcp-server\" -> ./dist/standalone.js");
            }
            if (errs.length) { console.error("::error::publish-shape gate failed — " + errs.join("; ")); process.exit(1); }
            console.log("publish-shape OK: " + need.join(" + ") + " packed; bin[mcp-server] set");
          '

      # E1 — claude-plugin/server/ is generated-but-committed (the marketplace
      # ships the git repo). A stale bundle means marketplace users run old
      # code; fail loudly instead.
      - name: Plugin bundle staleness gate
        # -c core.filemode=false: esbuild marks shebanged outputs executable;
        # contributor filesystems (WSL /mnt/c) can't represent that faithfully.
        # Content staleness is what we gate, not mode bits.
        # Review NIT — `git diff` is blind to UNTRACKED emissions (a newly
        # generated file the author forgot to `git add` would pass silently);
        # porcelain catches both modified and untracked.
        run: test -z "$(git -c core.filemode=false status --porcelain -- claude-plugin/server)" || (git -c core.filemode=false status --porcelain -- claude-plugin/server && echo "::error::claude-plugin/server is stale — run 'pnpm build:clean' (NOT a warm 'pnpm build', which can serve a cached bundle CI can't reproduce) and commit the result" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e specs boot a real daemon from the built dist, so build first.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @deeppairing/mcp-server exec playwright install --with-deps chromium

      - name: E2E (companion UI bootstrap + demo)
        run: pnpm --filter @deeppairing/mcp-server test:e2e
